<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة التحكم — ES Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin">

<!-- تسجيل الدخول -->
<div class="login" id="login">
  <form id="login-form">
    <h1>ES <span style="color:var(--primary)">Store</span></h1>
    <p>لوحة التحكم</p>
    <div class="field"><label for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password"></div>
    <div class="err-msg" id="login-err"></div>
    <button class="btn" style="width:100%;margin-top:10px">دخول</button>
    <div class="hint">ديمو — كلمة المرور: admin123</div>
  </form>
</div>

<div class="layout" id="app" hidden>
  <aside class="side">
    <div class="logo">ES <span style="color:var(--primary)">Store</span><small>لوحة التحكم</small></div>
    <button data-view="dashboard">📊 الرئيسية</button>
    <button data-view="orders">📦 الطلبات <span class="count" id="new-count" hidden></span></button>
    <button data-view="products">🧴 المنتجات</button>
    <button data-view="coupons">🏷️ كوبونات الخصم</button>
    <button data-view="settings">⚙️ الإعدادات</button>
    <div class="spacer"></div>
    <a href="index.html" target="_blank">🔗 فتح المتجر</a>
    <button id="logout">🚪 خروج</button>
  </aside>
  <main class="content" id="view"></main>
</div>

<!-- نافذة إضافة / تعديل منتج -->
<div class="modal" id="product-modal" hidden>
  <form class="modal-box" id="product-form" novalidate>
    <h2 id="pm-title">إضافة منتج</h2>
    <div class="form-grid">
      <div class="field"><label for="pm-name">اسم المنتج *</label><input id="pm-name"></div>
      <div class="field"><label for="pm-sub">وصف قصير *</label><input id="pm-sub" placeholder="مثلاً: كريم فيتامين سي للتفتيح"></div>
      <div class="field"><label for="pm-cat">القسم</label><select id="pm-cat"></select></div>
      <div class="field"><label for="pm-size">الحجم</label><input id="pm-size" placeholder="مثلاً: ١٠٠ مل"></div>
      <div class="field"><label for="pm-price">السعر (ج.م) *</label><input id="pm-price" type="number" min="1" inputmode="numeric"></div>
      <div class="field"><label for="pm-old">السعر قبل الخصم</label><input id="pm-old" type="number" min="0" inputmode="numeric"><small>سيبيه فاضي لو مفيش خصم</small></div>
      <div class="field"><label for="pm-badge">بادج</label><input id="pm-badge" placeholder="مثلاً: جديد"><small>لو فاضي وفيه خصم هيظهر نسبة الخصم</small></div>
      <div class="field"><label for="pm-active">الحالة</label><select id="pm-active"><option value="1">ظاهر في المتجر</option><option value="0">مخفي</option></select></div>
      <div class="field full"><label for="pm-desc">الوصف</label><textarea id="pm-desc" rows="3"></textarea></div>
      <div class="field"><label for="pm-benefits">الفوايد</label><textarea id="pm-benefits" rows="4" placeholder="كل فايدة في سطر"></textarea></div>
      <div class="field"><label for="pm-ing">المكونات</label><textarea id="pm-ing" rows="4" placeholder="كل مكون في سطر"></textarea></div>
      <div class="field full"><label for="pm-usage">طريقة الاستخدام</label><textarea id="pm-usage" rows="2"></textarea></div>
      <div class="field full">
        <label for="pm-images">الصور *</label>
        <input id="pm-images" type="file" accept="image/*" multiple>
        <small>أول صورة هي الصورة الرئيسية. الصور بتتصغر تلقائياً.</small>
        <div class="img-list" id="pm-img-list"></div>
      </div>
    </div>
    <div class="err-msg" id="pm-err"></div>
    <div class="modal-actions">
      <button class="btn">حفظ</button>
      <button type="button" class="btn btn-ghost" id="pm-cancel">إلغاء</button>
    </div>
  </form>
</div>

<script src="store.js"></script>
<script>
const $ = s => document.getElementById(s);
const PASSWORD = 'admin123'; // ديمو فقط — النسخة الحقيقية محتاجة تسجيل دخول من السيرفر

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}
const fmtDate = iso => new Date(iso).toLocaleString('ar-EG', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });

// ---------- الدخول ----------
function isLoggedIn() { try { return sessionStorage.getItem('es-admin') === '1'; } catch (e) { return false; } }
function showApp() { $('login').hidden = true; $('app').hidden = false; go(location.hash.slice(1) || 'dashboard'); }
$('login-form').onsubmit = e => {
  e.preventDefault();
  if ($('pw').value !== PASSWORD) { $('login-err').textContent = 'كلمة المرور غلط'; return; }
  try { sessionStorage.setItem('es-admin', '1'); } catch (e) { /* مش مهم */ }
  showApp();
};
$('logout').onclick = () => { try { sessionStorage.removeItem('es-admin'); } catch (e) {} location.reload(); };

// ---------- التنقل ----------
const views = { dashboard, orders, products, coupons, settings };
function go(name) {
  if (!views[name]) name = 'dashboard';
  history.replaceState(null, '', '#' + name);
  document.querySelectorAll('.side [data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  views[name]();
  const n = getOrders().filter(o => o.status === 'new').length;
  $('new-count').hidden = !n; $('new-count').textContent = toArabicDigits(n);
}
document.querySelectorAll('.side [data-view]').forEach(b => b.onclick = () => go(b.dataset.view));

// ---------- الرئيسية ----------
function dashboard() {
  const orders = getOrders().filter(o => o.status !== 'cancelled');
  const revenue = orders.reduce((s, o) => s + o.total, 0);
  const paid = orders.filter(o => o.paid).reduce((s, o) => s + o.total, 0);
  const sold = {};
  orders.forEach(o => o.items.forEach(i => sold[i.name] = (sold[i.name] || 0) + i.qty));
  const top = Object.entries(sold).sort((a, b) => b[1] - a[1]).slice(0, 5);
  $('view').innerHTML = `
    <div class="content-head"><h1>أهلاً بيكي 👋</h1></div>
    <div class="stats">
      <div class="stat"><span>عدد الطلبات</span><b>${toArabicDigits(orders.length)}</b></div>
      <div class="stat"><span>إجمالي المبيعات</span><b>${formatPrice(revenue)}</b></div>
      <div class="stat"><span>مدفوع أونلاين</span><b>${formatPrice(paid)}</b></div>
      <div class="stat"><span>المنتجات الظاهرة</span><b>${toArabicDigits(activeProducts().length)}</b></div>
    </div>
    <div class="box">
      <h2>آخر الطلبات</h2>
      ${ordersTable(getOrders().slice(0, 5), false)}
    </div>
    <div class="box">
      <h2>الأكثر مبيعاً</h2>
      ${top.length ? `<table><tr><th>المنتج</th><th>الكمية المباعة</th></tr>${top.map(([n, q]) => `<tr><td>${escapeHtml(n)}</td><td>${toArabicDigits(q)}</td></tr>`).join('')}</table>` : '<div class="empty-row">لسه مفيش مبيعات</div>'}
    </div>`;
  bindOrderTable();
}

// ---------- الطلبات ----------
function ordersTable(list, withDetails = true) {
  if (!list.length) return '<div class="empty-row">لسه مفيش طلبات. جربي تعملي طلب من المتجر.</div>';
  return `<table>
    <tr><th>رقم الطلب</th><th>التاريخ</th><th>العميلة</th><th>الإجمالي</th><th>الدفع</th><th>الحالة</th>${withDetails ? '<th></th>' : ''}</tr>
    ${list.map(o => `
      <tr>
        <td><b dir="ltr">${o.id}</b></td>
        <td class="muted">${fmtDate(o.date)}</td>
        <td>${escapeHtml(o.customer.name)}<div class="muted" dir="ltr" style="text-align:right">${escapeHtml(o.customer.phone)}</div></td>
        <td><b>${formatPrice(o.total)}</b></td>
        <td>${o.paid ? '<span class="pill paid">مدفوع أونلاين</span>' : '<span class="pill cod">عند الاستلام</span>'}</td>
        <td><select class="status-select" data-order="${o.id}">${Object.entries(ORDER_STATUSES).map(([k, v]) => `<option value="${k}" ${o.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
        ${withDetails ? `<td><button class="sm" data-toggle="${o.id}">التفاصيل</button></td>` : ''}
      </tr>
      ${withDetails ? `<tr class="order-details" id="d-${o.id}" hidden><td colspan="7">
        <div class="form-grid">
          <div><b>المنتجات</b><ul>${o.items.map(i => `<li>${escapeHtml(i.name)} × ${toArabicDigits(i.qty)} — ${formatPrice(i.price * i.qty)}</li>`).join('')}</ul>
            <div class="muted" style="margin-top:6px">المجموع ${formatPrice(o.subtotal)}${o.discount ? ` · خصم ${escapeHtml(o.coupon)} − ${formatPrice(o.discount)}` : ''} · الشحن ${o.shipping ? formatPrice(o.shipping) : 'مجاني'}${o.cardLast4 ? ` · كارت ••${o.cardLast4}` : ''}</div></div>
          <div><b>التوصيل</b><div>${escapeHtml([o.customer.governorate, o.customer.city, o.customer.address].join('، '))}</div>
            ${o.customer.notes ? `<div class="muted">ملاحظات: ${escapeHtml(o.customer.notes)}</div>` : ''}
            <a class="sm" style="display:inline-block;margin-top:8px;color:#1E7B3A" target="_blank" rel="noopener" href="https://wa.me/2${escapeHtml(o.customer.phone)}">💬 كلمي العميلة على واتساب</a></div>
        </div>
      </td></tr>` : ''}`).join('')}
  </table>`;
}
function bindOrderTable() {
  document.querySelectorAll('[data-order]').forEach(sel => sel.onchange = () => {
    saveOrders(getOrders().map(o => o.id === sel.dataset.order ? { ...o, status: sel.value } : o));
    toast('اتحدثت حالة الطلب');
    const n = getOrders().filter(o => o.status === 'new').length;
    $('new-count').hidden = !n; $('new-count').textContent = toArabicDigits(n);
  });
  document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
    const row = $('d-' + b.dataset.toggle);
    row.hidden = !row.hidden;
  });
}
function orders() {
  $('view').innerHTML = `<div class="content-head"><h1>الطلبات</h1></div><div class="box">${ordersTable(getOrders())}</div>`;
  bindOrderTable();
}

// ---------- المنتجات ----------
function products() {
  const list = getProducts();
  $('view').innerHTML = `
    <div class="content-head"><h1>المنتجات</h1><button class="btn" id="add-product">+ إضافة منتج</button></div>
    <div class="box">
      <table>
        <tr><th></th><th>المنتج</th><th class="hide-sm">القسم</th><th>السعر</th><th>ظاهر</th><th></th></tr>
        ${list.map(p => `
          <tr>
            <td><img src="${p.images[0] || ''}" alt=""></td>
            <td><b>${escapeHtml(p.name)}</b><div class="muted">${escapeHtml(p.sub)}</div></td>
            <td class="hide-sm">${escapeHtml(p.category)}</td>
            <td><b>${formatPrice(p.price)}</b>${p.oldPrice > p.price ? `<div class="muted"><s>${formatPrice(p.oldPrice)}</s></div>` : ''}</td>
            <td><label class="switch"><input type="checkbox" data-active="${escapeHtml(p.id)}" ${p.active ? 'checked' : ''}><span></span></label></td>
            <td class="actions"><button class="sm" data-edit="${escapeHtml(p.id)}">تعديل</button><a class="sm" href="product.html?id=${encodeURIComponent(p.id)}" target="_blank">عرض</a><button class="sm danger" data-del="${escapeHtml(p.id)}">مسح</button></td>
          </tr>`).join('')}
      </table>
    </div>`;
  $('add-product').onclick = () => openProduct(null);
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openProduct(b.dataset.edit));
  document.querySelectorAll('[data-active]').forEach(c => c.onchange = () => {
    saveProducts(getProducts().map(p => p.id === c.dataset.active ? { ...p, active: c.checked } : p));
    toast(c.checked ? 'المنتج ظاهر في المتجر' : 'المنتج اتخفى من المتجر');
  });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const p = getProduct(b.dataset.del);
    if (!confirm('متأكدة إنك عايزة تمسحي "' + p.name + '"؟')) return;
    saveProducts(getProducts().filter(x => x.id !== p.id));
    toast('المنتج اتمسح'); products();
  });
}

let editingId = null, editingImages = [];
$('pm-cat').innerHTML = CATEGORIES.map(c => `<option>${c}</option>`).join('');
const lines = v => v.split('\n').map(s => s.trim()).filter(Boolean);

function openProduct(id) {
  const p = id ? getProduct(id) : { name: '', sub: '', category: CATEGORIES[0], price: '', images: [], active: true };
  editingId = id;
  editingImages = [...p.images];
  $('pm-title').textContent = id ? 'تعديل المنتج' : 'إضافة منتج';
  $('pm-name').value = p.name; $('pm-sub').value = p.sub; $('pm-cat').value = p.category;
  $('pm-size').value = p.size || ''; $('pm-price').value = p.price; $('pm-old').value = p.oldPrice || '';
  $('pm-badge').value = p.badge || ''; $('pm-active').value = p.active ? '1' : '0';
  $('pm-desc').value = p.description || ''; $('pm-benefits').value = (p.benefits || []).join('\n');
  $('pm-ing').value = (p.ingredients || []).join('\n'); $('pm-usage').value = p.usage || '';
  $('pm-images').value = ''; $('pm-err').textContent = '';
  renderImgs();
  $('product-modal').hidden = false;
  $('pm-name').focus();
}
function renderImgs() {
  $('pm-img-list').innerHTML = editingImages.map((src, i) => `<div><img src="${src}" alt="">${i === 0 ? '<span class="main-tag">رئيسية</span>' : ''}<button type="button" data-rm="${i}" aria-label="مسح">×</button></div>`).join('');
  $('pm-img-list').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { editingImages.splice(+b.dataset.rm, 1); renderImgs(); });
}
// تصغير الصورة قبل الحفظ عشان مساحة المتصفح محدودة
function resizeImage(file, max = 800) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
$('pm-images').onchange = async e => {
  for (const f of e.target.files) {
    try { editingImages.push(await resizeImage(f)); } catch (err) { $('pm-err').textContent = 'مش قادرين نقرا الصورة ' + f.name; }
  }
  e.target.value = '';
  if (editingImages.length) $('pm-err').textContent = '';
  renderImgs();
};
$('pm-cancel').onclick = () => $('product-modal').hidden = true;

function makeId(name) {
  const base = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'product';
  let id = base, n = 2;
  while (getProduct(id)) id = base + '-' + n++;
  return id;
}

$('product-form').onsubmit = e => {
  e.preventDefault();
  const price = +$('pm-price').value, old = +$('pm-old').value || 0;
  const err = !$('pm-name').value.trim() ? 'اكتبي اسم المنتج'
    : !$('pm-sub').value.trim() ? 'اكتبي وصف قصير'
    : !(price > 0) ? 'اكتبي سعر صحيح'
    : old && old <= price ? 'السعر قبل الخصم لازم يكون أكبر من السعر'
    : !editingImages.length ? 'ضيفي صورة واحدة على الأقل' : '';
  if (err) { $('pm-err').textContent = err; return; }

  const list = getProducts();
  const existing = editingId ? list.find(p => p.id === editingId) : null;
  const data = {
    ...(existing || { rating: 0, reviews: 0 }),
    id: editingId || makeId($('pm-name').value),
    name: $('pm-name').value.trim(),
    sub: $('pm-sub').value.trim(),
    category: $('pm-cat').value,
    size: $('pm-size').value.trim(),
    price, oldPrice: old || undefined,
    badge: $('pm-badge').value.trim(),
    active: $('pm-active').value === '1',
    description: $('pm-desc').value.trim(),
    benefits: lines($('pm-benefits').value),
    ingredients: lines($('pm-ing').value),
    usage: $('pm-usage').value.trim(),
    images: editingImages
  };
  if (existing && existing.images[0] !== editingImages[0]) delete data.imagePosition;
  const next = existing ? list.map(p => p.id === editingId ? data : p) : [...list, data];
  if (!saveProducts(next)) { $('pm-err').textContent = 'مساحة التخزين في المتصفح خلصت — جربي صور أقل أو أصغر'; return; }
  $('product-modal').hidden = true;
  toast(existing ? 'اتحفظت التعديلات' : 'المنتج اتضاف للمتجر');
  products();
};

// ---------- الكوبونات ----------
function coupons() {
  const list = getCoupons();
  const today = new Date().toISOString().slice(0, 10);
  $('view').innerHTML = `
    <div class="content-head"><h1>كوبونات الخصم</h1></div>
    <div class="box">
      <h2>إضافة كوبون</h2>
      <form class="inline-form" id="coupon-form" novalidate>
        <div class="field"><label for="c-code">الكود</label><input id="c-code" dir="ltr" placeholder="SUMMER20" style="text-transform:uppercase"></div>
        <div class="field"><label for="c-type">النوع</label><select id="c-type"><option value="percent">نسبة ٪</option><option value="fixed">مبلغ ثابت ج.م</option></select></div>
        <div class="field"><label for="c-value">القيمة</label><input id="c-value" type="number" min="1"></div>
        <div class="field"><label for="c-min">أقل طلب (ج.م)</label><input id="c-min" type="number" min="0" placeholder="0"></div>
        <div class="field"><label for="c-exp">ينتهي في</label><input id="c-exp" type="date" min="${today}"></div>
        <button class="btn">إضافة</button>
      </form>
      <div class="err-msg" id="c-err"></div>
    </div>
    <div class="box">
      <table>
        <tr><th>الكود</th><th>الخصم</th><th>أقل طلب</th><th>ينتهي</th><th>استُخدم</th><th>مفعّل</th><th></th></tr>
        ${list.length ? list.map((c, i) => `
          <tr>
            <td><b dir="ltr">${escapeHtml(c.code)}</b></td>
            <td>${couponLabel(c)}</td>
            <td>${c.minTotal ? formatPrice(c.minTotal) : '—'}</td>
            <td>${c.expires ? toArabicDigits(c.expires) + (c.expires < today ? ' <span class="pill off">منتهي</span>' : '') : 'مفتوح'}</td>
            <td>${toArabicDigits(c.uses || 0)} مرة</td>
            <td><label class="switch"><input type="checkbox" data-c-active="${i}" ${c.active ? 'checked' : ''}><span></span></label></td>
            <td><button class="sm danger" data-c-del="${i}">مسح</button></td>
          </tr>`).join('') : '<tr><td colspan="7" class="empty-row">مفيش كوبونات</td></tr>'}
      </table>
    </div>`;

  $('coupon-form').onsubmit = e => {
    e.preventDefault();
    const code = $('c-code').value.trim().toUpperCase().replace(/\s+/g, '');
    const type = $('c-type').value, value = +$('c-value').value;
    const err = !/^[A-Z0-9_-]{3,20}$/.test(code) ? 'الكود من ٣ لـ ٢٠ حرف إنجليزي أو رقم'
      : getCoupons().some(c => c.code === code) ? 'الكود ده موجود قبل كده'
      : !(value > 0) ? 'اكتبي قيمة الخصم'
      : type === 'percent' && value > 100 ? 'النسبة لازم تكون ١٠٠ أو أقل' : '';
    if (err) { $('c-err').textContent = err; return; }
    saveCoupons([...getCoupons(), { code, type, value, minTotal: +$('c-min').value || 0, expires: $('c-exp').value, active: true, uses: 0 }]);
    toast('الكوبون اتضاف'); coupons();
  };
  document.querySelectorAll('[data-c-active]').forEach(c => c.onchange = () => {
    saveCoupons(getCoupons().map((x, i) => i === +c.dataset.cActive ? { ...x, active: c.checked } : x));
    toast(c.checked ? 'الكوبون اتفعّل' : 'الكوبون اتوقف');
  });
  document.querySelectorAll('[data-c-del]').forEach(b => b.onclick = () => {
    if (!confirm('مسح الكوبون؟')) return;
    saveCoupons(getCoupons().filter((_, i) => i !== +b.dataset.cDel));
    toast('الكوبون اتمسح'); coupons();
  });
}

// ---------- الإعدادات ----------
function settings() {
  const s = getSettings();
  $('view').innerHTML = `
    <div class="content-head"><h1>الإعدادات</h1></div>
    <form class="box" id="settings-form" novalidate>
      <div class="form-grid">
        <div class="field"><label for="s-wa">رقم واتساب المتجر</label><input id="s-wa" dir="ltr" value="0${escapeHtml(s.whatsapp.replace(/^20/, ''))}"><small>الطلبات بتتبعت على الرقم ده</small></div>
        <div class="field"><label for="s-promo">نص العرض في الشريط اللي فوق</label><input id="s-promo" value="${escapeHtml(s.promoText)}"></div>
        <div class="field"><label for="s-ship">مصاريف الشحن (ج.م)</label><input id="s-ship" type="number" min="0" value="${s.shippingFee}"></div>
        <div class="field"><label for="s-free">شحن مجاني للطلبات فوق (ج.م)</label><input id="s-free" type="number" min="0" value="${s.freeShippingOver}"></div>
      </div>
      <div class="err-msg" id="s-err"></div>
      <button class="btn" style="margin-top:14px">حفظ</button>
    </form>
    <div class="box">
      <h2>بيانات الديمو</h2>
      <p class="muted" style="font-size:14px;margin-bottom:10px">بيرجّع المنتجات والكوبونات والإعدادات للأصل، ويمسح الطلبات والسلة.</p>
      <button class="sm danger" id="reset">إعادة ضبط الديمو</button>
    </div>`;
  $('settings-form').onsubmit = e => {
    e.preventDefault();
    const wa = $('s-wa').value.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g, '');
    if (!/^01[0125]\d{8}$/.test(wa)) { $('s-err').textContent = 'رقم واتساب مصري من ١١ رقم يبدأ بـ 01'; return; }
    saveSettings({ whatsapp: '2' + wa, promoText: $('s-promo').value.trim(), shippingFee: +$('s-ship').value || 0, freeShippingOver: +$('s-free').value || 0 });
    $('s-err').textContent = '';
    toast('اتحفظت الإعدادات');
  };
  $('reset').onclick = () => {
    if (!confirm('متأكدة؟ كل التعديلات والطلبات هتتمسح.')) return;
    ['es-products', 'es-coupons', 'es-settings', 'es-orders', 'es-cart'].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
    toast('الديمو رجع للأصل'); settings();
  };
}

if (isLoggedIn()) showApp();
</script>
</body>
</html>
